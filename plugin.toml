# Catppuccin for OpenIDEA.
#
# A theme plugin is data only: no `wasm`, no permissions, nothing to compile.
# The package *is* this folder. `tools/gen_themes.py` writes the theme files from
# the official palette; edit that script rather than the generated JSON.
#
# The id is `muecheack.catppuccin`, not `muecheack-catppuccin`: `openidea-plugin
# pack --key` only signs plugins named `<publisher>.*` (a literal prefix match,
# dot included), and the publisher key here is `muecheack`. A dot in the id needs
# OpenIDEA 1.x — 0.1.x validated ids as `[a-z0-9][a-z0-9_-]*` and rejected it,
# but 0.1.x could not sign a package at all, so a signed package implies 1.x.
#
# Manifest format 0.1 (`openidea-api`), which 1.x IDEs still read as a legacy
# manifest. Kept instead of `engines.openidea` so the file stays longest-lived;
# the marketplace category is derived from `contributes` either way.
id = "muecheack.catppuccin"
name = "Catppuccin Theme"
version = "1.0.0"
description = "Catppuccin for OpenIDEA: Latte (light) plus Frappé, Macchiato and Mocha (dark), each setting 224 themeable tokens. Palette and style guide by the Catppuccin project (MIT)."
authors = ["Catppuccin contributors (palette and style guide)"]
homepage = "https://catppuccin.com"
change-notes = "1.0.0 — first release: all four flavours, UI and editor scheme."
openidea-api = "0.1"

# One entry per theme; `editor-scheme` is merged over the theme's tokens
# (IntelliJ's .theme.json + .icls pair). Reference: docs/plugins/themes.md.
[[contributes.themes]]
path = "themes/catppuccin-latte.theme.json"
editor-scheme = "themes/catppuccin-latte.scheme.json"

[[contributes.themes]]
path = "themes/catppuccin-frappe.theme.json"
editor-scheme = "themes/catppuccin-frappe.scheme.json"

[[contributes.themes]]
path = "themes/catppuccin-macchiato.theme.json"
editor-scheme = "themes/catppuccin-macchiato.scheme.json"

[[contributes.themes]]
path = "themes/catppuccin-mocha.theme.json"
editor-scheme = "themes/catppuccin-mocha.scheme.json"
